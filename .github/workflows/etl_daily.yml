name: Daily Financial ETL

on:
  schedule:
    # Berjalan setiap hari jam 00:00 UTC (jam 7 pagi WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Tombol manual di dashboard GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas sqlalchemy psycopg2-binary python-dotenv

      - name: Execute ETL Script
        env:
          # Mengambil kredensial dari GitHub Secrets
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: python scripts/etl_script.py